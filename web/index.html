<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nimbus</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Mission control</p>
          <h1 id="page-title">Draw a path. <span>Challenge Gemini.</span></h1>
        </div>
        <div class="header-actions">
          <button id="camera-mode" class="tool-button" type="button" aria-pressed="false">Start</button>
          <button id="fullscreen" class="tool-button" type="button">Fullscreen</button>
          <button id="free-draw" class="tool-button" type="button" aria-pressed="false" title="Toggle free draw (P)">Free draw</button>
        </div>
      </header>

      <main class="game-panel">
        <div class="meta-row">
          <div class="status-panel">
            <p id="status-text">Connecting to the Python game engine...</p>
          </div>
          <div class="quick-controls" aria-live="polite">
            <kbd>R</kbd><span>Retry</span><kbd>N</kbd><span>Next level</span><kbd>P</kbd><span>Free draw</span>
          </div>
        </div>

        <div class="free-draw-tools hidden" id="free-draw-tools" aria-label="Drawing tools">
          <span>Pen</span>
          <div id="pen-colors" class="pen-colors" role="group" aria-label="Pen color"></div>
          <label for="pen-size">Size</label>
          <select id="pen-size">
            <option value="4">Fine</option>
            <option value="8" selected>Medium</option>
            <option value="16">Bold</option>
          </select>
          <button class="tool-button" id="undo-drawing" type="button" title="Undo stroke (U)" disabled>Undo</button>
          <span class="drawing-hint">One finger draws · Two fingers change color</span>
        </div>

        <div class="canvas-wrap" id="canvas-wrap">
          <button class="tool-button exit-free-draw hidden" id="exit-free-draw" type="button" title="Back to game (Esc or P)">Back to game</button>
          <canvas id="game-canvas" width="960" height="600" aria-label="Game field. Draw from the drone with one finger; hold up two or more fingers to launch."></canvas>
        </div>
      </main>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
